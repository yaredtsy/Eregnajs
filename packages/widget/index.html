<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Eregna widget (dev)</title>
    <style>
      body { font-family: system-ui, sans-serif; margin: 0; background: #f7f7fb; color: #1f2430; }
      main { max-width: 760px; margin: 0 auto; padding: 32px 24px 50vh; display: flex; flex-direction: column; gap: 28px; }
      section { background: #fff; border: 1px solid #e3e5ef; border-radius: 14px; padding: 24px; }
      h1 { margin: 0 0 6px; font-size: 24px; }
      h2 { margin: 0 0 10px; font-size: 16px; }
      p { margin: 0; font-size: 14px; line-height: 1.6; color: #555d72; }
      .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 12px; }
      .card { border: 1px solid #e3e5ef; border-radius: 10px; padding: 14px; font-size: 13px; }
      button.cta { margin-top: 14px; background: #4f46e5; color: #fff; border: none; border-radius: 9px; padding: 9px 16px; font-size: 14px; cursor: pointer; }
      label { display: block; font-size: 12px; font-weight: 600; margin: 14px 0 4px; }
      input { width: 100%; box-sizing: border-box; border: 1px solid #d4d7e3; border-radius: 8px; padding: 9px 10px; font-size: 14px; }
    </style>
  </head>
  <body>
    <!-- Fake host page matching the sample conversation's element ids, so
         history playback resolves and highlights real elements in dev. -->
    <main>
      <section id="agents-page-hero">
        <h1>Agents</h1>
        <p>Create and manage the agents that guide visitors on your site.</p>
      </section>

      <section id="agents-grid">
        <h2>Your agents</h2>
        <div class="grid">
          <div class="card">Acme Support Bot</div>
          <div class="card">Docs Guide</div>
          <div class="card">Onboarding Walkthrough</div>
        </div>
        <button class="cta" id="new-agent-btn" type="button">+ New agent</button>
      </section>

      <section id="new-agent-form-section">
        <h2>New agent</h2>
        <label for="agent-name-field">Agent name</label>
        <input id="agent-name-field" placeholder="Acme Support Bot" />
        <label for="agent-url-field">Website URL</label>
        <input id="agent-url-field" placeholder="https://yourapp.com" />
        <button class="cta" type="button">Create agent</button>
      </section>
    </main>
    <script type="module" src="/src/dev-main.ts"></script>
  </body>
</html>
